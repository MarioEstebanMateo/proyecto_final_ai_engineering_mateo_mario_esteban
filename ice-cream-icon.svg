  <!-- Bola de helado marrón (chocolate) -->
  <circle cx="38" cy="18" r="10" fill="#D2691E" stroke="#8B4513" stroke-width="1.5"/>
  
  <!-- Toque de crema en la bola rosada -->
  <ellipse cx="34" cy="24" rx="3" ry="4" fill="#FFF" opacity="0.6"/>
  
  <!-- Detalles de brillo -->
  <circle cx="28" cy="15" r="2" fill="#FFF" opacity="0.8"/>
