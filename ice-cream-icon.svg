  <path d="M 22 32 L 26 46 L 30 38 L 34 50 L 38 40 L 42 32" stroke="#A0522D" stroke-width="1" opacity="0.5" stroke-linecap="round"/>
  
  <!-- Bola de helado rosada (fresa) -->
  <circle cx="32" cy="26" r="12" fill="#FFB6C1" stroke="#FF69B4" stroke-width="1.5"/>
  
  <!-- Bola de helado amarilla (vainilla) -->
